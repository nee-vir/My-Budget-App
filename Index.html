<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17181a">
<title>My Budget</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:24px 16px 48px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:16px}.top{padding:10px 0 22px}.month{font-size:14px;color:#71717a}.title{font-size:28px;font-weight:800;letter-spacing:-.7px;margin-top:3px}.mainbudget{margin-top:18px;padding:18px}.label{font-size:12px;color:#71717a}.master{display:flex;gap:9px;align-items:end;margin-top:5px}.master input{flex:1;min-width:0}.master button{width:110px}
input{min-height:44px;border:1px solid #d9d9dc;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;color:#18181b}.btn{min-height:44px;border:0;border-radius:10px;padding:10px 14px;background:#18181b;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#f0f0f1;color:#18181b;border:1px solid #ddd}.danger{background:#fff0f0;color:#9b1c1c;border:1px solid #efcaca}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 24px}.stat{padding:14px}.stat b{display:block;font-size:20px;margin-top:4px}.heroRemain{font-size:40px;font-weight:850;letter-spacing:-1.5px;margin-top:10px}.progress{height:10px;background:#e6e6e8;border-radius:99px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:#55565a;border-radius:99px}
h2{font-size:17px;margin:22px 0 10px}.section{margin-bottom:10px;overflow:hidden}.head{width:100%;border:0;background:#fff;color:inherit;text-align:left;padding:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:62px}.left{min-width:0}.name{font-weight:750}.meta{font-size:12px;color:#71717a;margin-top:4px}.right{text-align:right}.remain{font-weight:750}.bar{height:7px;background:#ededee;border-radius:99px;margin:0 15px 14px;overflow:hidden}.bar span{display:block;height:100%;background:#88898d;border-radius:99px}.body{border-top:1px solid #e4e4e7;padding:0 15px 15px}.actions{display:flex;gap:7px;justify-content:flex-end;padding:10px 0}.mini{min-height:36px;padding:7px 10px;font-size:12px}.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.tx:last-child{border-bottom:0}.txdesc{font-size:14px;font-weight:600}.txmeta{font-size:12px;color:#71717a;margin-top:3px}.txright{white-space:nowrap}.txamt{font-weight:700}.del{margin-left:7px;border:0;border-radius:8px;padding:6px 9px;background:#f0f0f1;cursor:pointer}.addexpense{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.addexpense button{grid-column:1/-1}
.addsection{display:grid;grid-template-columns:1fr 140px 80px;gap:8px}.setup{padding:15px}.empty{padding:18px;text-align:center;color:#71717a;font-size:14px}.unallocated{margin-top:8px;font-size:13px;color:#71717a}.message{min-height:18px;color:#9b1c1c;font-size:13px;margin-top:7px}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal{background:#fff;border-radius:16px;padding:18px;width:min(420px,100%)}.modal h3{margin:0 0 12px}.modalrow{display:grid;gap:9px}.modalactions{display:flex;gap:8px;margin-top:12px}
@media(max-width:560px){.app{padding:18px 12px 40px}.summary{grid-template-columns:1fr 1fr}.summary .stat:last-child{grid-column:1/-1}.heroRemain{font-size:35px}.addsection{grid-template-columns:1fr 120px}.addsection button{grid-column:1/-1}.addexpense{grid-template-columns:1fr}.addexpense button{grid-column:auto}.master{align-items:stretch;flex-direction:column}.master button{width:100%}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="month" id="month"></div>
    <div class="title">My Budget</div>
    <div class="card mainbudget">
      <div class="label">MASTER MONTHLY BUDGET</div>
      <div class="master">
        <input id="masterInput" type="number" min="0" step="100" inputmode="decimal" placeholder="Enter total budget">
        <button class="btn" id="saveMaster">Save</button>
      </div>
      <div class="message" id="masterMsg"></div>
    </div>
    <div class="heroRemain" id="remaining">₹0</div>
    <div class="label">total remaining</div>
    <div class="progress"><span id="overallFill"></span></div>
  </div>

  <div class="summary">
    <div class="card stat"><span class="label">Total budget</span><b id="total">₹0</b></div>
    <div class="card stat"><span class="label">Spent</span><b id="spent">₹0</b></div>
    <div class="card stat"><span class="label">Allocated</span><b id="allocated">₹0</b><div class="unallocated" id="unallocated">₹0 unallocated</div></div>
  </div>

  <h2>My budgets</h2>
  <div id="sections"></div>

  <h2>Add a budget section</h2>
  <div class="card setup">
    <div class="addsection">
      <input id="newName" maxlength="40" placeholder="e.g. Transport">
      <input id="newBudget" type="number" min="0" step="100" inputmode="decimal" placeholder="Budget ₹">
      <button class="btn" id="addSection">Add</button>
    </div>
  </div>

  <h2>Backup</h2>
  <div class="card setup">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn secondary" id="export">Export backup</button>
      <label class="btn secondary" style="display:inline-flex;align-items:center;cursor:pointer">Import backup<input id="import" type="file" accept=".json" style="display:none"></label>
      <button class="btn danger" id="reset">Reset all data</button>
    </div>
    <div class="label" style="margin-top:10px">Your data is stored locally in this browser. Export a backup before changing devices.</div>
  </div>
</main>

<div class="modalback" id="modal">
  <div class="modal">
    <h3>Edit budget section</h3>
    <div class="modalrow">
      <input id="editName" maxlength="40" placeholder="Section name">
      <input id="editBudget" type="number" min="0" step="100" inputmode="decimal" placeholder="Budget">
    </div>
    <div class="modalactions">
      <button class="btn" id="editSave">Save changes</button>
      <button class="btn secondary" id="editCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const KEY="my-budget-dynamic-v2";
let state=load(),editing=null;
const money=n=>"₹"+Math.round(Number(n)||0).toLocaleString("en-IN");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.cats)&&Array.isArray(x.expenses)&&typeof x.master==="number")return x}catch(e){}return{master:0,cats:[],expenses:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function spent(id){return state.expenses.filter(e=>e.cat===id).reduce((a,e)=>a+e.amount,0)}
function render(){
 document.getElementById("month").textContent=new Intl.DateTimeFormat("en-IN",{month:"long",year:"numeric"}).format(new Date());
 document.getElementById("masterInput").value=state.master||"";
 const total=state.master||0,all=state.expenses.reduce((a,e)=>a+e.amount,0),allocated=state.cats.reduce((a,c)=>a+(Number(c.budget)||0),0),rem=total-all,p=total?Math.min(100,Math.max(0,all/total*100)):0;
 document.getElementById("total").textContent=money(total);document.getElementById("spent").textContent=money(all);document.getElementById("allocated").textContent=money(allocated);document.getElementById("unallocated").textContent=money(total-allocated)+" unallocated";document.getElementById("remaining").textContent=money(rem);document.getElementById("overallFill").style.width=p+"%";
 const sections=document.getElementById("sections");
 if(!state.cats.length){sections.innerHTML='<div class="card empty">Set your master budget above, then add your first budget section below.</div>';return}
 sections.innerHTML=state.cats.map(c=>{
   const s=spent(c.id),r=c.budget-s,cp=c.budget?Math.min(100,Math.max(0,s/c.budget*100)):0;
   const tx=state.expenses.filter(e=>e.cat===c.id).map(e=>`<div class="tx"><div><div class="txdesc">${esc(e.desc||c.name)}</div><div class="txmeta">${esc(e.date)}</div></div><div class="txright"><span class="txamt">${money(e.amount)}</span><button class="del" data-del="${e.id}">Delete</button></div></div>`).join("");
   return `<div class="card section"><button class="head" data-open="${c.id}"><div class="left"><div class="name">${c.icon||"📌"} ${esc(c.name)}</div><div class="meta">Budget ${money(c.budget)} · Spent ${money(s)}</div></div><div class="right"><div class="remain">${money(r)}</div><div class="meta">${c.open?"⌃":"⌄"} remaining</div></div></button><div class="bar"><span style="width:${cp}%"></span></div>${c.open?`<div class="body"><div class="actions"><button class="btn secondary mini edit" data-edit="${c.id}">Edit section</button><button class="btn danger mini remove" data-remove="${c.id}">Delete section</button></div>${tx||'<div class="empty">No spending recorded yet.</div>'}<div class="addexpense"><input class="amount" data-cat="${c.id}" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Amount (₹)"><input class="desc" data-cat="${c.id}" maxlength="80" placeholder="Description (optional)"><button class="btn" data-add="${c.id}">＋ Add expense</button></div></div>`:""}</div>`;
 }).join("");
 bind();
}
function bind(){
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{let c=state.cats.find(x=>x.id===b.dataset.open);c.open=!c.open;save();render()});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{state.expenses=state.expenses.filter(e=>String(e.id)!==b.dataset.del);save();render()});
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const box=b.parentElement,a=box.querySelector(".amount"),d=box.querySelector(".desc"),v=parseFloat(a.value);if(!Number.isFinite(v)||v<=0){a.focus();return}state.expenses.push({id:Date.now()+Math.random(),cat:b.dataset.add,amount:v,desc:d.value.trim(),date:new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric"}).format(new Date())});save();render()});
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editing=b.dataset.edit;const c=state.cats.find(x=>x.id===editing);document.getElementById("editName").value=c.name;document.getElementById("editBudget").value=c.budget;document.getElementById("modal").style.display="flex";document.getElementById("editName").focus()});
 document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const c=state.cats.find(x=>x.id===b.dataset.remove);if(confirm('Delete "'+c.name+'"? Its budget section will be removed, and its recorded expenses will also be deleted.')){state.cats=state.cats.filter(x=>x.id!==c.id);state.expenses=state.expenses.filter(e=>e.cat!==c.id);save();render()}});
}
document.getElementById("saveMaster").onclick=()=>{const v=parseFloat(document.getElementById("masterInput").value);const msg=document.getElementById("masterMsg");if(!Number.isFinite(v)||v<0){msg.textContent="Please enter a valid budget.";return}state.master=v;msg.textContent="";save();render()};
document.getElementById("addSection").onclick=()=>{const n=document.getElementById("newName").value.trim(),v=parseFloat(document.getElementById("newBudget").value);if(!n||!Number.isFinite(v)||v<0){alert("Enter a section name and a valid budget.");return}state.cats.push({id:"c"+Date.now()+Math.random(),name:n,icon:"📌",budget:v,open:true});document.getElementById("newName").value="";document.getElementById("newBudget").value="";save();render()};
document.getElementById("editSave").onclick=()=>{const c=state.cats.find(x=>x.id===editing),n=document.getElementById("editName").value.trim(),v=parseFloat(document.getElementById("editBudget").value);if(c&&n&&Number.isFinite(v)&&v>=0){c.name=n;c.budget=v;c.icon=c.icon||"📌";c.open=true;save();closeModal();render()}};
function closeModal(){document.getElementById("modal").style.display="none";editing=null}
document.getElementById("editCancel").onclick=closeModal;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.getElementById("export").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-budget-backup.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(typeof x.master!=="number"||!Array.isArray(x.cats)||!Array.isArray(x.expenses))throw 0;state=x;save();render();alert("Backup imported successfully.")}catch(_){alert("Invalid My Budget backup.")}};r.readAsText(f)};
document.getElementById("reset").onclick=()=>{if(confirm("Delete ALL budget and expense data? This cannot be undone without a backup.")){localStorage.removeItem(KEY);state=load();render()}};
render();
</script>
</body>
</html>
